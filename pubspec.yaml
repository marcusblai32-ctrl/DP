name: dimension_production_suivi
description: Application hors ligne de suivi pédagogique pour Dimension Production.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  pdf: ^3.11.1
  excel: ^4.0.6
  archive: ^3.6.1
  share_plus: ^10.1.4
  cross_file: ^0.3.4+2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/dp_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/dp_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/dp_icon.png"
