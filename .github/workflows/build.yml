name: Build DP Scolaire Android + Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      # Some plugins now require Android API 36. Flutter's generated Android
      # template may use an older compileSdk, so raise it before resolving/building.
      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          found = False
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text()
              updated = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              updated = updated.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
              updated = updated.replace('compileSdkVersion flutter.compileSdkVersion.toInt()', 'compileSdkVersion 36')
              if updated != text:
                  path.write_text(updated)
                  found = True
                  print(f'Updated compile SDK in {path} to 36')
              elif 'compileSdk = 36' in text or 'compileSdkVersion 36' in text:
                  found = True
                  print(f'{path} already uses compile SDK 36')
          if not found:
              raise SystemExit('Could not find the Android app Gradle compileSdk setting')
          PYCODE

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: dp-scolaire-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows application
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform files
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Windows release
        run: flutter build windows --release

      - name: Archive Windows release files
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dp-scolaire-windows-release.zip -Force

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: dp-scolaire-windows-release
          path: dp-scolaire-windows-release.zip
          if-no-files-found: error
          retention-days: 14
