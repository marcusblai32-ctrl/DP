name: Build DP Scolaire Android + Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      # Some plugins now require Android API 36. Flutter's generated Android
      # template may use an older compileSdk, so raise it before resolving/building.
      - name: Install dependencies
        run: flutter pub get

      # Recent Android plugins can declare compileSdk 34 even when the app
      # uses API 36. Update the app and cached plugin Gradle files before build.
      - name: Set Android compile SDK to 36 for app and plugins
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          roots = [Path('android'), Path.home() / '.pub-cache' / 'hosted']
          changed = []
          pattern = re.compile(
              r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)(\s*(?:\n|$))'
          )
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.name not in ('build.gradle', 'build.gradle.kts'):
                      continue
                  try:
                      original = path.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue
                  updated, count = pattern.subn(lambda m: m.group(1) + '36' + m.group(2), original)
                  if count:
                      path.write_text(updated)
                      changed.append(f'{path}: {count} compileSdk setting(s)')
          if not changed:
              raise SystemExit('No Gradle compileSdk setting was updated; refusing to build with the old SDK.')
          print('Updated Android compile SDK to API 36:')
          print('\n'.join(changed))
          PYCODE

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: dp-scolaire-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows application
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform files
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Windows release
        run: flutter build windows --release

      - name: Archive Windows release files
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dp-scolaire-windows-release.zip -Force

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: dp-scolaire-windows-release
          path: dp-scolaire-windows-release.zip
          if-no-files-found: error
          retention-days: 14
