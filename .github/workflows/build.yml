name: Build DP Android + Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Verify logo exists
        shell: bash
        run: |
          test -f assets/dp_icon.png || { echo 'ERROR: assets/dp_icon.png not found in project root'; exit 1; }

      - name: Generate Android launcher icon only
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml

      - name: Set Android app name to DP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.exists():
              raise SystemExit(f'ERROR: {manifest} not found')
          text = manifest.read_text(encoding='utf-8')
          if re.search(r'android:label="[^"]*"', text):
              text = re.sub(r'android:label="[^"]*"', 'android:label="DP"', text, count=1)
          else:
              text = text.replace('<application', '<application android:label="DP"', 1)
          manifest.write_text(text, encoding='utf-8')
          print('Android display name set to DP')
          PY

      - name: Enable Android reminder notifications (permissions + desugaring)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          perms = [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.VIBRATE',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.USE_EXACT_ALARM',
          ]
          add = ''.join('    <uses-permission android:name="%s"/>\n' % p for p in perms if p not in text)
          if add:
              text = text.replace('<application', add + '    <application', 1)
              manifest.write_text(text, encoding='utf-8')
          for name in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              f = Path(name)
              if not f.exists():
                  continue
              kts = name.endswith('.kts')
              gradle = f.read_text(encoding='utf-8')
              if 'coreLibraryDesugaring' in gradle:
                  continue
              flag = 'isCoreLibraryDesugaringEnabled = true' if kts else 'coreLibraryDesugaringEnabled true'
              gradle = re.sub(r'(compileOptions\s*\{)', lambda m: m.group(1) + '\n        ' + flag, gradle, count=1)
              if kts:
                  gradle += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              else:
                  gradle += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              f.write_text(gradle, encoding='utf-8')
              print('Desugaring enabled in', name)
          print('Notification permissions configured')
          PY

      - name: Set Android compile SDK to 36 for app and cached plugins
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path('android'), Path.home() / '.pub-cache' / 'hosted']
          patterns = [
              re.compile(r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)(\s*(?://.*)?$)'),
              re.compile(r'(?m)^(\s*compileSdk(?:Version)?\s*\(\s*)(?:flutter\.compileSdkVersion|\d+)(\s*\).*)$'),
          ]
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for file in root.rglob('*'):
                  if file.name not in ('build.gradle', 'build.gradle.kts'):
                      continue
                  try:
                      original = file.read_text(encoding='utf-8')
                  except (OSError, UnicodeDecodeError):
                      continue
                  updated = original
                  for pattern in patterns:
                      updated = pattern.sub(lambda m: m.group(1) + '36' + m.group(2), updated)
                  if updated != original:
                      file.write_text(updated, encoding='utf-8')
                      changed.append(str(file))
          print('Gradle files changed to compile SDK 36:')
          print('\n'.join(changed) if changed else 'No matching compileSdk declarations found')
          PY

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DP-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows application
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform files
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Verify logo exists
        shell: pwsh
        run: |
          if (!(Test-Path 'assets/dp_icon.png')) {
            Write-Error 'ERROR: assets/dp_icon.png not found in project root'
            exit 1
          }

      - name: Generate Windows launcher icon only
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_windows.yaml

      - name: Set Windows app window title to DP
        shell: pwsh
        run: |
          $runnerFiles = @('windows/runner/main.cpp', 'windows/runner/flutter_window.cpp')
          foreach ($file in $runnerFiles) {
            if (Test-Path $file) {
              $content = Get-Content $file -Raw
              $updated = $content -replace 'L"DP Scolaire"', 'L"DP"' -replace 'L"dp_scolaire"', 'L"DP"' -replace '"DP Scolaire"', '"DP"'
              if ($updated -ne $content) {
                Set-Content -Path $file -Value $updated -NoNewline
                Write-Host "Updated window title in $file"
              }
            }
          }

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Windows release
        run: flutter build windows --release

      - name: Archive Windows release files
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath DP-Windows-Release.zip -Force

      - name: Upload Windows ZIP (EXE + required DLLs and assets)
        uses: actions/upload-artifact@v4
        with:
          name: DP-Windows-ZIP
          path: DP-Windows-Release.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows EXE separately
        uses: actions/upload-artifact@v4
        with:
          name: DP-Windows-EXE
          path: build/windows/x64/runner/Release/*.exe
          if-no-files-found: error
          retention-days: 14
