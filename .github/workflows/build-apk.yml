name: Build DP Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name dimension_production .
      - name: Set Android app display name to DP
        run: |
          sed -i 's/<application/<application android:label="DP"/' android/app/src/main/AndroidManifest.xml
      - name: Install dependencies
        run: flutter pub get
      - name: Generate DP launcher icon
        run: dart run flutter_launcher_icons
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: DP-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
